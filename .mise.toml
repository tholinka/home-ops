[env]
FLATE_PATH = '{{config_root}}/kubernetes/apps'
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
JUST_UNSTABLE = "1"

[tools]
"packslip:github.com/helmfile/helmfile" = "1.8.2"

"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:postfinance/topf" = "0.6.2"
"aqua:helmfile/vals" = "0.50.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"github:guarnz/deadvalues" = "0.1.9"
"github:mitsuhiko/minijinja" = "3.0.5"

"npm:oxfmt" = "0.75.0"

"github:home-operations/flate" = "v0.6.5"

[hooks]
postinstall = "lefthook install"
