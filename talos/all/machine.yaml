---
machine:
  certSANs:
    - cluster.servers.internal
    - 127.0.0.1
  udev:
    rules:
      ## save power
      - SUBSYSTEM=="pci", ATTR{power/control}="auto"
      - SUBSYSTEM=="ata_port", KERNEL=="ata*", ATTR{device/power/control}="auto"
      - SUBSYSTEM=="block", KERNEL=="sd[a-z]", ATTR{device/power/control}="auto"
      - SUBSYSTEM=="scsi_host", KERNEL=="host*", ATTR{link_power_management_policy}="med_power_with_dipm"
      - SUBSYSTEM=="usb", TEST=="power/control", ATTR{power/control}="auto"

      ## IO scheduler
      # BFQ is recommended for slow storage such as rotational block devices and SD cards.
      - ACTION=="add|change", SUBSYSTEM=="block", ATTR{queue/rotational}=="1", ATTR{queue/scheduler}="bfq"
      - ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="mmcblk?", ATTR{queue/scheduler}="bfq"

      # None is recommended for NVMe
      - ACTION=="add|change", SUBSYSTEM=="block", ATTR{queue/rotational}=="0", KERNEL=="nvme?n?", ATTR{queue/scheduler}="none"
      # Kyber is recommended for SATA SSDs.
      - ACTION=="add|change", SUBSYSTEM=="block", ATTR{queue/rotational}=="0", KERNEL=="sd?", ATTR{queue/scheduler}="kyber"
  features:
    hostDNS:
      enabled: true
      resolveMemberNames: true
      forwardKubeDNSToHost: true # Requires Cilium socketLB features
  files:
    - op: create # spegel
      path: /etc/cri/conf.d/20-customization.part
      permissions: 0o644
      content: |-
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          device_ownership_from_security_context = true

    - op: overwrite
      path: /etc/nfsmount.conf
      permissions: 0o644
      content: |
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        nconnect=16
        noatime=True
  kubelet:
    extraMounts:
      - destination: /var/openebs/local
        type: bind
        source: /var/openebs/local
        options:
          - bind
          - rshared
          - rw
    extraConfig:
      serializeImagePulls: false
  kernel:
    modules:
      - name: nbd
  sysctls:
    fs.inotify.max_user_watches: 1048576 # Watchdog
    fs.inotify.max_user_instances: 8192 # Watchdog
    net.core.default_qdisc: fq # 10Gb/s
    net.core.rmem_max: 67108864 # 10Gb/s | Cloudflared / QUIC
    net.core.wmem_max: 67108864 # 10Gb/s | Cloudflared / QUIC
    net.ipv4.neigh.default.gc_thresh1: 4096
    net.ipv4.neigh.default.gc_thresh2: 8192
    net.ipv4.neigh.default.gc_thresh3: 16384
    net.ipv4.ping_group_range: 0 2147483647
    net.ipv4.tcp_congestion_control: bbr # 10Gb/s
    net.ipv4.tcp_fastopen: 3 # Send and accept data in the opening SYN packet
    net.ipv4.tcp_mtu_probing: 1 # Jumbo frames
    net.ipv4.tcp_notsent_lowat: 131072
    net.ipv4.tcp_rmem: 4096 87380 33554432 # 10Gb/s
    net.ipv4.tcp_wmem: 4096 65536 33554432 # 10Gb/s
    net.ipv4.tcp_slow_start_after_idle: 0
    net.ipv4.tcp_window_scaling: 1 # 10Gb/s
    sunrpc.tcp_slot_table_entries: 128 # 10Gb/s | NFS
    sunrpc.tcp_max_slot_table_entries: 128 # 10Gb/s | NFS
    vm.dirty_writeback_centisecs: 3000 # aggregate more writes together, don't wake up drives as often. default is 500 (aka 5s)
    vm.nr_hugepages: 1024 # PostgreSQL
    user.max_user_namespaces: 11255 # User Namespaces requires this

    # Enable IPv6 Privacy Extensions
    net.ipv6.conf.all.use_tempaddr: 2
    net.ipv6.conf.default.use_tempaddr: 2

    # ignore router adverts so we don't get an ip we don't need
    # multus will handle it on the pods that need it
    net.ipv6.conf.bond0/30.accept_ra: 0
    net.ipv6.conf.bond0.accept_ra: 2 # this didn't use to be required, but /proc/sys/net/ipv6/conf/bond0/forwarding seems to be set now
