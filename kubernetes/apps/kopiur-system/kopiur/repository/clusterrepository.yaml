---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: nas.servers.internal
          path: /backups/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-nas
      namespace: &namespace kopiur-system
  moverDefaults:
    resources:
      requests:
        cpu: 150m
        memory: 1Gi
      limits:
        memory: 2Gi
  maintenance:
    schedule:
      quick: # close the current epoch
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  parameters:
    epoch:
      # literally the absolute minimum, but should prevent index blobs from getting to large
      minDuration: 1h
  scheduleDefaults:
    timezone: America/Chicago
  # server:
  #   auth:
  #     # we netpol the service so only the gateway can reach it, and put it behind authentik
  #     insecure:
  #       acknowledgeInsecure: true
  #   namespace: *namespace
  #   readOnly: true
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: '${AWS_S3_BUCKET}'
      endpoint: '${AWS_S3_ENDPOINT}'
      auth:
        secretRef: &secret
          name: kopiur-s3
          namespace: &namespace kopiur-system
  encryption:
    passwordSecretRef: *secret
  maintenance:
    schedule:
      quick:
        # close the current epoch
        cron: '0 6 * * *'
        jitter: 1h
      full:
        cron: '0 12 * * 0'
        jitter: 4h
  moverDefaults:
    resources:
      requests:
        cpu: 150m
        memory: 1Gi
      limits:
        memory: 2Gi
  parameters:
    epoch:
      # default
      minDuration: 24h
  scheduleDefaults:
    timezone: America/Chicago
  # server:
  #   auth:
  #     # we netpol the service so only the gateway can reach it, and put it behind authentik
  #     insecure:
  #       acknowledgeInsecure: true
  #   namespace: *namespace
  #   readOnly: true
