---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pgadmin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: 'true'

        initContainers:
          init:
            image: &image
              repository: mirror.gcr.io/dpage/pgadmin4
              tag: 9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
            command: # pgadmin only creates the per-user .pgpass when the user is first created, so this manually updates it
              - /bin/sh
              - -c
              - >-
                for i in "/var/lib/pgadmin/storage"/*/; do
                  if [ -d "$i" ]; then
                    cp /pgadmin4/pgpass "$i/.pgpass";
                    chown 5050:5050 "$i/.pgpass";
                    chmod 500 "$i/.pgpass";
                  fi;
                done
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
        containers:
          main:
            image: *image
            env:
              PGADMIN_DISABLE_POSTFIX: 'True'
              PGADMIN_LISTEN_PORT: &port 80
              PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
              PGADMIN_CONFIG_SERVER_MODE: 'True'
              PGPASS_FILE: &pgpass /pgadmin4/pgpass
            envFrom:
              - externalSecretRef:
                  identifier: env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /misc/ping
                    port: *port
                  failureThreshold: 10
              readiness: *probes
              startup: *probes
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 500Mi

    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${KOPIUR_PUID}
        runAsGroup: ${KOPIUR_PGID}
        fsGroup: ${KOPIUR_PGID}
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - pg.tholinka.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: pgAdmin
          gethomepage.dev/icon: pgadmin.svg
          gethomepage.dev/siteMonitor: http://pgadmin.database.svc.cluster.local

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/pgadmin
      oauth:
        type: secret
        externalSecretRef: files
        globalMounts:
          - path: /pgadmin4/config_local.py
            subPath: config_local.py
            readOnly: true
          - path: *pgpass
            subPath: pgpass
            readOnly: true
          - path: /pgadmin4/servers.json
            subPath: servers.json
            readOnly: true

    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden

    externalSecrets:
      env:
        target:
          template:
            data:
              PGADMIN_DEFAULT_EMAIL: '{{ .PGADMIN_DEFAULT_EMAIL }}'
              PGADMIN_DEFAULT_PASSWORD: '{{ .PGADMIN_DEFAULT_PASSWORD }}'
        dataFrom:
          - extract:
              key: *app
      files:
        target:
          template:
            data:
              config_local.py: |
                AUTHENTICATION_SOURCES = ['oauth2'] #, 'internal']
                OAUTH2_AUTO_CREATE_USER = True
                MASTER_PASSWORD_REQUIRED = False
                OAUTH2_CONFIG = [{
                    'OAUTH2_NAME' : 'authentik',
                    'OAUTH2_DISPLAY_NAME' : 'Authentik',
                    'OAUTH2_CLIENT_ID' : '{{ .PGADMIN_CLIENT_ID }}',
                    'OAUTH2_CLIENT_SECRET' : '{{ .PGADMIN_CLIENT_SECRET }}',
                    'OAUTH2_TOKEN_URL' : 'https://auth.tholinka.dev/application/o/token/',
                    'OAUTH2_AUTHORIZATION_URL' : 'https://auth.tholinka.dev/application/o/authorize/',
                    'OAUTH2_API_BASE_URL' : 'https://auth.tholinka.dev/',
                    'OAUTH2_USERINFO_ENDPOINT' : 'https://auth.tholinka.dev/application/o/userinfo/',
                    'OAUTH2_SERVER_METADATA_URL' : 'https://auth.tholinka.dev/application/o/pgadmin/.well-known/openid-configuration',
                    'OAUTH2_SCOPE' : 'openid email profile',
                    'OAUTH2_ICON' : 'fa-openid',
                    'OAUTH2_BUTTON_COLOR' : '#2db1fd'
                }]
              pgpass: |
                *:*:*:{{ .POSTGRES_SUPER_USER }}:{{ .POSTGRES_SUPER_PASS }}
              servers.json: |
                {
                  "Servers": {
                    "1": {
                      "Name": "postgres-cluster",
                      "Group": "Servers",
                      "Host": "postgres-cluster-rw.database.svc.cluster.local",
                      "Port": 5432,
                      "Shared": true,
                      "MaintenanceDB": "postgres",
                      "Username": "{{ .POSTGRES_SUPER_USER }}",
                      "SharedUsername": "{{ .POSTGRES_SUPER_USER }}",
                      "ConnectionParameters": {
                        "passfile": ".pgpass",
                        "sslmode": "prefer"
                      },
                      "SSLCompression": 0,
                      "Timeout": 10,
                      "UseSSHTunnel": 0,
                      "TunnelPort": "22",
                      "TunnelAuthentication": 0
                    }
                  }
                }
        dataFrom:
          - extract:
              key: *app
          - extract:
              key: cloudnative_pg
