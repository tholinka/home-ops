---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name chaski
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *name
    template:
      data:
        PUSHOVER_USER_KEY: '{{ .PUSHOVER_USER_KEY }}'
        SEERR_PUSHOVER_TOKEN: '{{ .SEERR_PUSHOVER_TOKEN }}'
        RADARR_PUSHOVER_TOKEN: '{{ .RADARR_PUSHOVER_TOKEN }}'
        SONARR_PUSHOVER_TOKEN: '{{ .SONARR_PUSHOVER_TOKEN }}'
        LIDARR_PUSHOVER_TOKEN: '{{ .LIDARR_PUSHOVER_TOKEN }}'
  dataFrom:
    - extract:
        key: seerr
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: lidarr
    - extract:
        key: pushover
