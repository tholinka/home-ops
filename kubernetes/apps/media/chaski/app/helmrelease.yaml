---
# yaml-language-server: $schema=https://schemas.tholinka.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app chaski
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    replicaCount: 2
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'
    envFrom:
      - secretRef:
          name: *app
    service:
      port: &port 80
    config:
      port: *port
      targets:
        seerr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SEERR_PUSHOVER_TOKEN" }}
        radarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        sonarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SONARR_PUSHOVER_TOKEN" }}
        lidarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "LIDARR_PUSHOVER_TOKEN" }}
      routes:
        seerr-available:
          target: seerr
          title: '{{ .payload.event }}: {{ .payload.subject }}'
          message: |-
            <small><b>Requested By:</b> {{ .payload.request.requestedBy_username }}</small>
            <small>\t<b>Status:</b> {{ .payload.media.status }}</small>
            <small>\t<b>Type:</b> {{ .payload.media.media_type }}</small>
            <small>\n{{ .payload.image }}</small>
          params:
            format: html
            priority: low
            url: '{{ .payload.applicationUrl }}/media/{{ .payload.media.id }}'
            url_title: View Media
          whenExpr: payload.notification_type == "MEDIA_AVAILABLE"
        radarr-download:
          target: radarr
          title: Movie {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small>{{ .payload.movie.overview | ellipsis 300 }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: '{{ .payload.applicationUrl }}/movie/{{ .payload.movie.tmdbId }}'
            url_title: View Movie
          whenExpr: payload.eventType == "Download"
        radarr-manual:
          target: radarr
          title: Movie Requires Manual Interaction
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: '{{ .payload.applicationUrl }}/activity/queue'
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        sonarr-download:
          target: sonarr
          title: Episode {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.series.title }} ({{ printf "S%02dE%02d" (toInt (index .payload.episodes 0).seasonNumber) (toInt (index .payload.episodes 0).episodeNumber) }})</b>
            <small>{{ (index .payload.episodes 0).title }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: '{{ .payload.applicationUrl }}/series/{{ .payload.series.titleSlug }}'
            url_title: View Series
          whenExpr: payload.eventType == "Download"
        sonarr-manual:
          target: sonarr
          title: Episode Requires Manual Interaction
          message: |-
            <b>{{ .payload.series.title }}</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: '{{ .payload.applicationUrl }}/activity/queue'
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        lidarr-download:
          target: lidarr
          title: Album {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.album.title }} ({{ .payload.album.year }})</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: '{{ .payload.applicationUrl }}/album/{{ .payload.album.id }}'
            url_title: View Album
          whenExpr: payload.eventType == "Download"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
