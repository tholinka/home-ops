---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name brrpolice
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *name
    template:
      data:
        QBITTORRENT_URL: 'http://qui.media.svc.cluster.local/proxy/{{ .QBITTORRENT_PROXY_ID }}'
  dataFrom:
    - extract:
        key: *name
