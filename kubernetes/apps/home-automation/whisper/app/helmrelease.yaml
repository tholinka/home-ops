---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whisper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        containers:
          app:
            image:
              repository: mirror.gcr.io/rhasspy/wyoming-whisper
              tag: 3.6.0@sha256:b7da5869ac9caba5f8db1c0dec373fb46a58d31f4aee1855faa7b49b7c0d4b49
            args:
              # - --stt-library=faster-whisper
              # - --model=distil-small.en
              # # - --compute-type=int8 # faster, but seems to make more errors
              # - --stt-library=sherpa
              # - --model=sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8 # v2 is better for english
              - --stt-library=qwen3-asr
              - --vad-clip=qwen3-asr
              - --language=en
              - --hass-token=$(HASS_LONG_LIVED_TOKEN)
              - --hass-api=http://home-assistant.home-automation.svc.cluster.local/api
            envFrom:
              - secretRef:
                  name: *app
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 500m
                memory: 2G
              limits:
                memory: 8G

    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          wyoming:
            port: 10300

    persistence:
      data:
        size: 5Gi
        accessMode: ReadWriteOnce

      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /.cache
            subPath: cache
          - path: tmp
            subPath: tmp
