---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zwave
spec:
  interval: 1h
  components:
    - ../../../../components/kopiur
    - ../../../../components/ext-auth
    - ../../../../components/scaler/instance
  dependsOn:
    - name: crds-ready
      namespace: flux-system
  path: ./kubernetes/apps/home-automation/zwave/app
  postBuild:
    substitute:
      APP: *app
      SCALER_INSTANCE: zwave.iot.internal
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-automation
