---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ocis
spec:
  interval: 1h
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: crds-ready
      namespace: flux-system
  path: ./kubernetes/apps/self-hosted/ocis/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 150Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
