---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app thelounge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/thelounge
              tag: 4.5.2@sha256:b1603864b3eae673f780aa56e966d9b488986ed71d2260b408ebc9a6d5cdd0df
            env:
              THELOUNGE_PORT: &port 80
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }

    defaultPodOptions:
      hostUsers: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: *app

    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Home
          gethomepage.dev/name: The Lounge
          gethomepage.dev/icon: thelounge.svg
        hostnames: [thelounge.tholinka.dev]
        parentRefs:
          - name: &gateway envoy-internal
            namespace: &gatewayns network

    networkpolicies:
      main:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: *app
            app.kubernetes.io/instance: *app
        ingress:
          - fromEndpoints:
              - matchLabels:
                  gateway.networking.k8s.io/gateway-name: *gateway
                  k8s:io.kubernetes.pod.namespace: *gatewayns
            toPorts:
              - ports:
                  - port: '9000'
                    protocol: TCP
