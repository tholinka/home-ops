---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pihole-nebula-sync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          *app :
            image:
              repository: ghcr.io/lovelaze/nebula-sync
              tag: v0.11.3@sha256:59c51378460f6dc8707cc91a16aa62dff5cd5dd8b39353658b45cb00d6bfddd8
            env:
              FULL_SYNC: false
              CRON: '0/10 * * * *' # sync should be fast, since we're only syncing dns entries, but there seems to be a memory leak that eventually kills the primary pihole... also it randomly breaks the exporter sometimes
              RUN_GRAVITY: false

              SYNC_CONFIG_DNS: true # sync external dns
              SYNC_GRAVITY_DOMAIN_LIST: true # sync manual allow/deny list (lost on restart because of emptyDir)

              SYNC_CONFIG_DNS_EXCLUDE: upstreams # nas has a different set of upstreams
            envFrom:
              - externalSecretRef:
                  identifier: env
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      priorityClassName: system-cluster-critical
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden

    externalSecrets:
      env:
        target:
          template:
            data:
              PRIMARY: 'http://pihole-0.pihole.network.svc.cluster.local.|{{ .PASSWORD }}'
              REPLICAS: 'http://pihole-1.pihole.network.svc.cluster.local.|{{ .PASSWORD }},http://pihole-2.pihole.network.svc.cluster.local.|{{ .PASSWORD }},http://nas.servers.internal.|{{ .PASSWORD }}'
        dataFrom:
          - extract:
              key: pihole
