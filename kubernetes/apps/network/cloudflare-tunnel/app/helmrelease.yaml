---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      cloudflared:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: mirror.gcr.io/cloudflare/cloudflared
              tag: 2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
            env:
              NO_AUTOUPDATE: true
              TUNNEL_CRED_FILE: /etc/cloudflared/creds/credentials.json
              TUNNEL_METRICS: 0.0.0.0:8080
              TUNNEL_ORIGIN_ENABLE_HTTP2: true
              TUNNEL_TRANSPORT_PROTOCOL: quic
              TUNNEL_POST_QUANTUM: true
              TUNNEL_ID: ${SECRET_CLOUDFLARE_TUNNEL_ID}
            args:
              - tunnel
              - --config
              - /etc/cloudflared/config/config.yaml
              - --edge-ip-version
              - auto
              - run
              - '$(TUNNEL_ID)'
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534

    service:
      app:
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config/config.yaml
            subPath: config.yaml
            readOnly: true
      creds:
        type: secret
        externalSecretRef: files
        globalMounts:
          - path: /etc/cloudflared/creds/credentials.json
            subPath: credentials.json
            readOnly: true

    configMaps:
      config:
        data:
          config.yaml: |-
            ---
            originRequest:
              http2Origin: true
              keepAliveTimeout: 3600s
              originServerName: external.tholinka.dev
              tcpKeepAlive: 7200s

            ingress:
              - hostname: tholinka.dev
                service: &svc https://envoy-external.network.svc.cluster.local
              - hostname: '*.tholinka.dev'
                service: *svc
              - service: http_status:404

    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden

    externalSecrets:
      files:
        target:
          template:
            data:
              credentials.json: |
                {
                  "AccountTag": "{{ .CLOUDFLARE_ACCOUNT_TAG }}",
                  "TunnelSecret": "{{ .CLOUDFLARE_TUNNEL_SECRET }}",
                  "TunnelID": "{{ .CLOUDFLARE_TUNNEL_ID }}"
                }
        dataFrom:
          - extract:
              key: cloudflare
