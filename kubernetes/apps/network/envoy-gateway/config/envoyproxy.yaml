---
# yaml-language-server: $schema=https://schemas.tholinka.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: config
spec:
  ipFamily: DualStack
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
  shutdown:
    drainTimeout: 60s
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          volumeMounts:
            - name: wasm-eep
              mountPath: /opt/wasm/eep
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 640Mi
            limits:
              cpu: 500m
              memory: 1Gi
        pod:
          volumes:
            - name: wasm-eep
              image:
                reference: ghcr.io/ishioni/eep:0.4.1@sha256:57b684f4fbb5a6209ef32ba68f571d2de9f0253516ea1372219ad5341f1e0c91
                pullPolicy: IfNotPresent
      envoyHpa:
        minReplicas: 1
        maxReplicas: 5
        metrics:
          - resource:
              name: cpu
              target:
                averageUtilization: 60
                type: Utilization
            type: Resource
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 300
          scaleDown:
            stabilizationWindowSeconds: 300
      envoyService:
        externalTrafficPolicy: Local
  wasmModules:
    - name: eep
      source:
        type: Local
        local:
          path: /opt/wasm/eep/plugin.wasm
