---
# yaml-language-server: $schema=https://schemas.tholinka.dev/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: eep
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  wasm:
    - name: eep
      rootID: eep
      config:
        theme: connection
        showDetails: false
        locale: en # slim down size vs auto, otherwise get response_payload_too_large errors from envoy
        #logLevel: debug
        # Plex, etc use 401 to indicate a redirect to login, so we don't want to break that
        filterCodes: [404, '500-510']
        excludeDomains: []
      failOpen: false
